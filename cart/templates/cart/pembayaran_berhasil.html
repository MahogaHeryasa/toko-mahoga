<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Berhasil!</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EBEBEB] flex items-center justify-center min-h-screen p-6 font-sans">
    
    <div class="bg-white p-10 rounded-[2rem] shadow-sm w-full max-w-md text-center">
        
        <!-- Ikon Centang Hijau -->
        <div class="w-20 h-20 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-green-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
                <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
        </div>
        
        <h2 class="text-3xl font-black text-gray-900 mb-2">Lunas!</h2>
        <p class="text-gray-500 mb-6">Terima kasih, pembayaran untuk pesanan <span class="font-bold text-gray-800">{{ order.order_id }}</span> telah kami terima.</p>
        
        <div class="bg-gray-50 border border-gray-100 rounded-2xl p-4 mb-8 text-sm text-gray-600">
            Pesanan Anda sedang masuk ke tahap <strong>Dikemas</strong>. Kami akan segera mengirimkannya ke alamat Anda.
        </div>

        <!-- Tombol Kembali -->
        <a href="/" class="block w-full bg-[#0108A1] hover:bg-blue-900 text-white font-bold py-3.5 rounded-xl transition-colors shadow-md">
            Kembali ke Beranda
        </a>
    </div>
    
</body>
</html>
