<!DOCTYPE html>
<html lang="id">
<head>
    <title>Beri Ulasan - {{ produk.nama }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#EBEBEB] min-h-screen flex items-center justify-center px-3 py-6 sm:px-6 sm:py-8">
    
    <div class="bg-white p-6 sm:p-10 md:p-12 rounded-3xl shadow-sm w-full max-w-4xl min-h-[680px]">
        <h2 class="text-3xl font-black text-gray-900 mb-3 sm:text-2xl">Beri Ulasan</h2>
        <p class="text-base text-gray-500 mb-6 sm:text-sm">Bagaimana kepuasan Anda terhadap <strong>{{ produk.nama }}</strong>?</p>
        
        <!-- Form Ulasan dengan Bintang Interaktif dan Drag & Drop -->
        <form action="{% url 'tambah_ulasan' produk.id %}" method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            
            <!-- Bintang Interaktif -->
            <div class="mb-6">
                <label class="block text-base font-semibold text-gray-700 mb-2 sm:text-sm">Penilaian Anda</label>
                <div class="flex items-center gap-1 cursor-pointer" id="bintang-rating">
                    <!-- 5 Bintang SVG -->
                    <svg data-value="1" class="star w-9 h-9 text-yellow-400 transition-colors duration-200" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>
                    <svg data-value="2" class="star w-9 h-9 text-yellow-400 transition-colors duration-200" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>
                    <svg data-value="3" class="star w-9 h-9 text-yellow-400 transition-colors duration-200" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>
                    <svg data-value="4" class="star w-9 h-9 text-yellow-400 transition-colors duration-200" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>
                    <svg data-value="5" class="star w-9 h-9 text-yellow-400 transition-colors duration-200" fill="currentColor" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279-7.416-3.967-7.417 3.967 1.481-8.279-6.064-5.828 8.332-1.151z"/></svg>
                </div>
                <input type="hidden" name="rating" id="input-rating" value="5">
            </div>

            <!-- Tulis Komentar -->
            <div class="mb-4">
                <label class="block text-base font-semibold text-gray-700 mb-2 sm:text-sm">Ceritakan pengalaman Anda</label>
                <textarea name="komentar" rows="4" required placeholder="Barangnya sesuai deskripsi, pengiriman cepat..." class="w-full border border-gray-300 rounded-xl p-3 text-base focus:outline-none focus:border-[#0108A1] sm:text-sm"></textarea>
            </div>

            <!-- Area Drag & Drop Gambar -->
            <div class="mb-6">
                <label class="block text-base font-semibold text-gray-700 mb-2 sm:text-sm">Lampirkan Foto</label>
                
                <div id="dropzone" class="w-full border-2 border-dashed border-gray-300 rounded-xl p-8 flex flex-col items-center justify-center cursor-pointer hover:bg-gray-50 transition-colors bg-white">
                    <svg class="w-10 h-10 text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <p class="text-base text-gray-600 font-medium text-center sm:text-sm">Klik atau Tarik & Lepas foto di sini</p>
                    <p class="text-sm text-gray-400 mt-1 sm:text-xs">Bisa lebih dari 1 foto. Mendukung JPG, PNG.</p>
                    
                    <!-- Input file disembunyikan -->
                    <input type="file" name="gambar" id="file-input" accept="image/*" multiple class="hidden">
                </div>

                <!-- Tempat munculnya preview gambar -->
                <div id="preview-container" class="mt-4 flex flex-wrap gap-3 empty:hidden"></div>
            </div>

            <div class="flex gap-3">
                <a href="{% url 'tracking_order' %}" class="w-1/3 text-center px-4 py-3 text-base bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold rounded-xl transition-colors">Batal</a>
                <button type="submit" class="w-2/3 text-base bg-[#0108A1] hover:bg-blue-900 text-white font-bold py-3 rounded-xl transition-colors shadow-md">Kirim Ulasan</button>
            </div>
        </form>
    </div>
    
    <!-- Script untuk Logika Klik Bintang dan Drag & Drop -->
    <script>
        // --- LOGIKA BINTANG ---
        const stars = document.querySelectorAll('.star');
        const inputRating = document.getElementById('input-rating');
        
        stars.forEach(star => {
            star.addEventListener('click', function() {
                const value = this.getAttribute('data-value');
                inputRating.value = value;
                
                stars.forEach(s => {
                    if (s.getAttribute('data-value') <= value) {
                        s.classList.add('text-yellow-400');
                        s.classList.remove('text-gray-300');
                    } else {
                        s.classList.add('text-gray-300');
                        s.classList.remove('text-yellow-400');
                    }
                });
            });
        });

        // --- LOGIKA DRAG & DROP MULTIPLE FILE ---
        const dropzone = document.getElementById('dropzone');
        const fileInput = document.getElementById('file-input');
        const previewContainer = document.getElementById('preview-container');
        
        // DataTransfer bertindak sebagai wadah keranjang file
        // yang memungkinkan kita menambah file berkali-kali tanpa ter-overwrite
        let dataTransfer = new DataTransfer();

        // 1. Jika dropzone diklik, buka penjelajah file
        dropzone.addEventListener('click', () => fileInput.click());

        // 2. Efek saat file diseret melayang di atas dropzone
        dropzone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropzone.classList.add('border-[#0108A1]', 'bg-blue-50');
        });

        // 3. Efek saat file batal ditaruh
        dropzone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-[#0108A1]', 'bg-blue-50');
        });

        // 4. Proses file saat dilepas (drop)
        dropzone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropzone.classList.remove('border-[#0108A1]', 'bg-blue-50');
            handleFiles(e.dataTransfer.files);
        });

        // 5. Proses file saat dipilih lewat klik biasa
        fileInput.addEventListener('change', function(e) {
            handleFiles(this.files);
        });

        function handleFiles(files) {
            for (let i = 0; i < files.length; i++) {
                // Pastikan hanya gambar yang bisa masuk
                if (files[i].type.startsWith('image/')) {
                    // Cek agar tidak ada duplikasi file dengan nama yang sama
                    let exists = false;
                    for (let j = 0; j < dataTransfer.files.length; j++) {
                        if (dataTransfer.files[j].name === files[i].name) {
                            exists = true;
                            break;
                        }
                    }
                    
                    if (!exists) {
                        dataTransfer.items.add(files[i]);
                        createPreview(files[i]);
                    }
                }
            }
            // Sinkronkan input file dengan keranjang dataTransfer
            fileInput.files = dataTransfer.files;
        }

        function createPreview(file) {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = function(e) {
                const div = document.createElement('div');
                div.className = "relative w-24 h-24 group rounded-xl overflow-hidden shadow-sm";
                // Menyimpan nama file sebagai ID agar mudah dicari saat mau dihapus
                div.dataset.filename = file.name;
                
                div.innerHTML = `
                    <img src="${e.target.result}" class="w-full h-full object-cover">
                    <button type="button" class="absolute top-1 right-1 bg-red-500 text-white rounded-full p-1 opacity-0 group-hover:opacity-100 transition-opacity" onclick="removeFile('${file.name}', this)">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                previewContainer.appendChild(div);
            }
        }

        function removeFile(fileName, btnElement) {
            // Hapus elemen gambar dari layar
            btnElement.closest('div').remove();
            
            // Buat DataTransfer baru, dan isi dengan file-file yang TIDAK dihapus
            const newDataTransfer = new DataTransfer();
            for (let i = 0; i < dataTransfer.files.length; i++) {
                if (dataTransfer.files[i].name !== fileName) {
                    newDataTransfer.items.add(dataTransfer.files[i]);
                }
            }
            
            // Timpa data yang lama dengan yang baru
            dataTransfer = newDataTransfer;
            fileInput.files = dataTransfer.files;
        }
    </script>
</body>
</html>
