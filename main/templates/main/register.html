<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Toko Mahoga Heryasa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        form p { margin-bottom: 1.25rem; }
        form input { width: 100%; box-sizing: border-box; border: 1px solid #d1d5db; padding: 0.875rem 1.25rem !important; border-radius: 0.875rem; margin-top: 0.5rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; background-color: #f9fafb; }
        form input:focus { border-color: #0108A1; background-color: #fff; box-shadow: 0 0 0 3px rgba(1, 8, 161, 0.1); }
        label { font-size: 0.875rem; font-weight: 700; color: #374151; }
        .helptext, ul.errorlist { font-size: 0.75rem; color: #ef4444; margin-top: 0.5rem; display: block; list-style-type: none; padding: 0; }
        .helptext { color: #6b7280; }
    </style>
</head>
<body class="flex min-h-screen items-center justify-center bg-[#EBEBEB] p-6">
    <div class="w-full max-w-md rounded-[2rem] bg-white p-8 shadow-lg md:p-10">
        <div class="mb-8 text-center">
            <div class="mx-auto flex h-16 w-16 items-center justify-center rounded-full bg-yellow-100 p-2">
                <img src="/media/images/mahoga.jpeg" alt="Logo Toko Mahoga Heryasa" class="h-full w-full rounded-full object-cover">
            </div>
            <p class="mt-5 text-sm font-semibold uppercase tracking-widest text-gray-400">Selamat datang di</p>
            <h1 class="mt-2 text-2xl font-black text-[#0108A1]">Toko Mahoga Heryasa</h1>
            <p class="mt-2 text-sm text-gray-500">Buat akun untuk mulai berbelanja</p>
        </div>
        
        <form method="post" class="flex flex-col">
            {% csrf_token %}
            {{ form.as_p }}
            
            <button type="submit" class="mt-2 rounded-xl bg-[#FFB03A] py-3.5 font-bold text-white shadow-md transition-colors hover:bg-[#F09F29]">
                DAFTAR
            </button>
        </form>
        
        <p class="mt-7 text-center text-sm text-gray-500">
            Sudah punya akun? <a href="{% url 'login' %}" class="text-[#0108A1] font-bold hover:underline">Masuk di sini</a>
        </p>
    </div>
</body>
</html>
